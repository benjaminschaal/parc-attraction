name: Probe temporaire

# Fichier jetable, supprimé avant l'ouverture de la pull request. Le proxy
# réseau de la session de développement bloque api.wartezeiten.app, Nominatim
# et Overpass ; un runner GitHub y accède. Ce job sert uniquement à relever les
# informations nécessaires pour déclarer de nouveaux parcs, en lisant sa sortie
# dans les logs. Aucune écriture sur le dépôt.

on:
  push:
    branches: [claude/iphone-menu-queue-history-t8x41i]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: python3 scripts/tmp-probe.py disneylandparis disneyadventureworld futuroscope nigloland
