name: Probe temporaire

# Fichier jetable, supprimé avant l'ouverture de la pull request. Le proxy
# réseau de la session de développement bloque api.wartezeiten.app, Overpass et
# Nominatim ; un runner GitHub y accède. Ce job sert uniquement à vérifier
# l'identifiant exact d'un parc avant de l'ajouter au code, en lisant la sortie
# dans les logs. Aucune écriture sur le dépôt.

on:
  push:
    branches: [claude/iphone-menu-queue-history-t8x41i]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tmp-probe.mjs
